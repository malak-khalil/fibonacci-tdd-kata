
[project]
name = "fibonacci-tdd-kataa"
version = "0.1.0"
description = "A TDD kata: Fibonacci, from notebook exploration to a tested, published package"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "malak khalil", email = "malak.khalil@lau.edu" }
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibonacci_tdd_kata"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "ruff>=0.16.8",
    "marimo>=0.24.2",
    "mypy>=2.4.0",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018", "PLR1711", "F401"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90

